
<!DOCTYPE html>
<html>
<head>
    <title>Online Quiz</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #e8f5f0;
            background-image: url("images/classroom.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.55);
            z-index: -1;
        }

        header {
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .home-btn {
            text-decoration: none;
            color: white;
            background: #2e8b70;
            padding: 10px 22px;
            border-radius: 25px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 25px auto;
            padding: 35px;
            background: rgba(255,255,255,0.13);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            backdrop-filter: blur(8px);
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 36px;
        }

        .subtitle {
            text-align: center;
            color: #e8fff7;
            margin-bottom: 30px;
        }

        .question {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 15px;
        }

        .question h3 {
            color: #236b57;
            margin-bottom: 15px;
        }

        label {
            display: block;
            padding: 9px;
            margin: 5px 0;
            background: #f0f8f5;
            border-radius: 8px;
            cursor: pointer;
        }

        label:hover {
            background: #d8eee7;
        }

        input {
            margin-right: 8px;
        }

        .submit-btn {
            display: block;
            margin: 25px auto 10px;
            padding: 12px 35px;
            border: none;
            border-radius: 25px;
            background: #2e8b70;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #17634e;
        }

        #result {
            text-align: center;
            color: white;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 25px auto 0;
            text-decoration: none;
            color: white;
            background: #555;
            padding: 10px 22px;
            border-radius: 22px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">SMART PORTAL</div>

    <a href="index.html" class="home-btn">🏠 Home</a>
</header>

<div class="container">

    <h1>🧠 Online Quiz</h1>

    <p class="subtitle">
        Test your BCS knowledge
    </p>

    <form id="quizForm">

        <div class="question">
            <h3>1. What does DBMS stand for?</h3>

            <label>
                <input type="radio" name="q1" value="a">
                Data Basic Management System
            </label>

            <label>
                <input type="radio" name="q1" value="b">
                Database Management System
            </label>

            <label>
                <input type="radio" name="q1" value="c">
                Data Backup Management System
            </label>
        </div>


        <div class="question">
            <h3>2. Which language is mainly used to create web pages?</h3>

            <label>
                <input type="radio" name="q2" value="a">
                HTML
            </label>

            <label>
                <input type="radio" name="q2" value="b">
                C
            </label>

            <label>
                <input type="radio" name="q2" value="c">
                SQL
            </label>
        </div>


        <div class="question">
            <h3>3. Which one is a programming language?</h3>

            <label>
                <input type="radio" name="q3" value="a">
                HTML
            </label>

            <label>
                <input type="radio" name="q3" value="b">
                Python
            </label>

            <label>
                <input type="radio" name="q3" value="c">
                CSS
            </label>
        </div>


        <div class="question">
            <h3>4. What is the full form of CPU?</h3>

            <label>
                <input type="radio" name="q4" value="a">
                Central Processing Unit
            </label>

            <label>
                <input type="radio" name="q4" value="b">
                Computer Processing Utility
            </label>

            <label>
                <input type="radio" name="q4" value="c">
                Central Program Unit
            </label>
        </div>


        <div class="question">
            <h3>5. Which tag is used to create a hyperlink in HTML?</h3>

            <label>
                <input type="radio" name="q5" value="a">
                &lt;p&gt;
            </label>

            <label>
                <input type="radio" name="q5" value="b">
                &lt;a&gt;
            </label>

            <label>
                <input type="radio" name="q5" value="c">
                &lt;img&gt;
            </label>
        </div>


        <button type="button" class="submit-btn" onclick="checkQuiz()">
            Submit Quiz
        </button>

        <div id="result"></div>

    </form>

    <a href="student.html" class="back">← Back to Student</a>

</div>


<script>

function checkQuiz() {

    let score = 0;

    let answers = {
        q1: "b",
        q2: "a",
        q3: "b",
        q4: "a",
        q5: "b"
    };

    for (let question in answers) {

        let selected = document.querySelector(
            'input[name="' + question + '"]:checked'
        );

        if (selected && selected.value === answers[question]) {
            score++;
        }
    }

    document.getElementById("result").innerHTML =
        "🎉 Your Score: " + score + " / 5";

}

</script>

</body>
</html>
